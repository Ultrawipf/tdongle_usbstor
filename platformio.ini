; ---------------------------------------------------------------------------
;  usb_stor_emu - LilyGO T-Dongle-S3 configurable USB mass storage device
; ---------------------------------------------------------------------------
;  The stock LilyGO board definition builds with ARDUINO_USB_MODE=1 (hardware
;  USB-Serial-JTAG).  USB MSC requires the TinyUSB OTG stack, so this project
;  ships its own board definition in boards/ with ARDUINO_USB_MODE=0.
;
;  After the first flash the ROM serial port disappears and is replaced by the
;  TinyUSB CDC port.  To re-flash, hold BOOT and re-plug the dongle.
; ---------------------------------------------------------------------------

[platformio]
default_envs = tdongle-s3

[env:tdongle-s3]
platform = espressif32@6.13.0
board = tdongle-s3-msc
framework = arduino

board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; CDC_ON_BOOT must stay 0: the core starts TinyUSB before setup() when it is
; enabled, which locks the descriptors before the config has been read. The
; CDC console is brought up by src/logbuf.cpp instead, after VID/PID/strings
; are set and before USB.begin().
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -Wno-unused-variable

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Uncomment for the T-Dongle-S3-Plus / -Dual variants (see README.md)
; build_flags = ${env:tdongle-s3.build_flags} -DARDUINO_DONGLES3_PLUS
